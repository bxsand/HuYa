name: 虎牙虎粮自动发放

on:
  schedule:
    - cron: '30 16 * * *'  # 北京时间 00:30
  workflow_dispatch:
    inputs:
      rooms:
        description: '房间号，逗号分隔'
        required: false
        default: ''

jobs:
  send-hl:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 缓存 Python 依赖（超级提速）
      - name: 缓存 Python 依赖
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: 设置 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 安装 Chrome（setup-chrome，与 Run#4 验证过的配置一致）
      - name: 安装 Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: latest
          install-chromedriver: true

      # 安装依赖
      - name: 安装 Python 包
        run: pip install -r requirements.txt

      # 检查 Cookie（用环境变量注入，避免特殊字符破坏 shell）
      - name: 检查 HUYA_COOKIE
        env:
          HUYA_COOKIE: ${{ secrets.HUYA_COOKIE }}
        run: |
          if [ -z "$HUYA_COOKIE" ]; then
            echo "❌ 未配置 HUYA_COOKIE"
            exit 1
          fi

      # 获取房间号
      - name: 获取房间号
        id: get-rooms
        run: |
          if [ -n "${{ github.event.inputs.rooms }}" ]; then
            echo "rooms=${{ github.event.inputs.rooms }}" >> $GITHUB_OUTPUT
          else
            if [ -z "${{ secrets.HUYA_ROOMS }}" ]; then
              echo "❌ 未配置 HUYA_ROOMS"
              exit 1
            fi
            echo "rooms=${{ secrets.HUYA_ROOMS }}" >> $GITHUB_OUTPUT
          fi

      # 运行脚本（CHROME_BIN/CHROMEWEBDRIVER 由 setup-chrome 提供）
      - name: 运行虎粮发放
        env:
          HUYA_COOKIE: ${{ secrets.HUYA_COOKIE }}
          HUYA_ROOMS: ${{ steps.get-rooms.outputs.rooms }}
          SEND_KEY: ${{ secrets.SEND_KEY }}
          HEADLESS: "true"
        run: |
          python main.py
