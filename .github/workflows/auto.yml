name: 虎牙虎粮自动发放

on:
  # 定时由华为云函数 huya-dispatcher 触发（每日北京时间 00:30）。
  # 不用 GitHub 自带 schedule：公共/fork 仓库 60 天无活动会被自动禁用，
  # 且实测延迟 2~4 小时不可控。workflow_dispatch 不受 60 天限制。
  workflow_dispatch:
    inputs:
      rooms:
        description: '房间号，逗号分隔（留空则用 secrets.HUYA_ROOMS）'
        required: false
        default: ''

# 防撞车：云函数 dispatch 与手动触发可能几乎同时发生，排队而非并行
# （送礼是消耗性操作，两个 run 并行会把同一批虎粮重复送出）
concurrency:
  group: send-hl
  cancel-in-progress: false

jobs:
  send-hl:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 缓存 Python 依赖
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: 设置 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 不装 Chrome、不装 chromedriver：runner 自带 /usr/bin/google-chrome，
      # 交给 Selenium Manager 自动匹配驱动（setup-chrome 会塞进不匹配的 chromedriver）
      - name: 查看 Chrome 版本
        run: google-chrome --version || chromium --version || true

      - name: 安装 Python 包
        run: pip install -r requirements.txt

      - name: 检查 HUYA_COOKIE
        env:
          HUYA_COOKIE: ${{ secrets.HUYA_COOKIE }}
        run: |
          if [ -z "$HUYA_COOKIE" ]; then
            echo "❌ 未配置 HUYA_COOKIE"
            exit 1
          fi

      - name: 获取房间号
        id: get-rooms
        run: |
          if [ -n "${{ github.event.inputs.rooms }}" ]; then
            echo "rooms=${{ github.event.inputs.rooms }}" >> $GITHUB_OUTPUT
          else
            if [ -z "${{ secrets.HUYA_ROOMS }}" ]; then
              echo "❌ 未配置 HUYA_ROOMS"
              exit 1
            fi
            echo "rooms=${{ secrets.HUYA_ROOMS }}" >> $GITHUB_OUTPUT
          fi

      - name: 运行虎粮发放 + 打卡
        env:
          HUYA_COOKIE: ${{ secrets.HUYA_COOKIE }}
          HUYA_ROOMS: ${{ steps.get-rooms.outputs.rooms }}
          SEND_KEY: ${{ secrets.SEND_KEY }}
          HEADLESS: "true"
          PYTHONUNBUFFERED: "1"
        run: |
          python main.py
